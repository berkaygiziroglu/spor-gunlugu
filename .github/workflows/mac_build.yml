name: Build Mac App

on: [push]

jobs:
  build-mac:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --windowed --target-arch universal2 --add-data "fotografimiz.png:." main.py

      - name: Fix Permissions and Zip
        run: |
          cd dist
          chmod -R +x main.app
          zip -r -y Spor_Gunlugu_Mac.zip main.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spor_Gunlugu_Mac
          path: dist/Spor_Gunlugu_Mac.zip
