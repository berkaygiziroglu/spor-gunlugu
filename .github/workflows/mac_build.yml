name: Build Mac App

on: [push]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pillow pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --add-data "fotografimiz.png:." main.py

      - name: Zip Build
        run: |
          cd dist
          zip -r Spor_Gunlugu_Mac.zip main.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Spor_Gunlugu_Mac
          path: dist/Spor_Gunlugu_Mac.zip
